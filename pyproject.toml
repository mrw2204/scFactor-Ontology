[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scfo"
version = "0.1.0"
description = "Portable utilities for factor-centric ontology resources built from gene x factor loading matrices."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "anndata",
  "muon",
  "numpy",
  "pandas",
  "scanpy",
  "scipy",
  "tqdm",
  "openpyxl"
]

[project.optional-dependencies]
gsea = ["gseapy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
