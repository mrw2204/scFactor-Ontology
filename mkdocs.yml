site_name: scFactor-Ontology
theme:
  name: readthedocs

docs_dir: docs

nav:
  - Home: index.md
  - Vignette: vignette.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
